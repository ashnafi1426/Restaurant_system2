<!DOCTYPE html>
<html lang="">
  <head>
    <meta charset="UTF-8">
    <link rel="icon" href="/favicon.ico">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,400,0,0"
    />
    <title>Hotel Managment system</title>
    <style>
      /* Initial loader styles - shown before Vue app loads */
      #initial-loader {
        position: fixed;
        inset: 0;
        z-index: 10000;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background: white;
        transition: opacity 0.3s ease;
      }
      
      #initial-loader .logo-container {
        position: relative;
        margin-bottom: 2rem;
      }
      
      #initial-loader .spinner-ring {
        position: absolute;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      
      #initial-loader .ring-static {
        width: 12rem;
        height: 12rem;
        border-radius: 9999px;
        border: 4px solid #fee2e2;
      }
      
      #initial-loader .ring-animated {
        position: absolute;
        width: 12rem;
        height: 12rem;
        border-radius: 9999px;
        border: 4px solid transparent;
        border-top-color: #dc2626;
        animation: spin 1.5s linear infinite;
      }
      
      #initial-loader .logo-image {
        position: relative;
        display: flex;
        align-items: center;
        justify-content: center;
        width: 12rem;
        height: 12rem;
      }
      
      #initial-loader img {
        width: 8rem;
        height: 8rem;
        object-fit: contain;
        animation: pulse 2s ease-in-out infinite;
      }
      
      #initial-loader h1 {
        font-size: 1.875rem;
        font-weight: bold;
        color: #991b1b;
        margin-bottom: 0.5rem;
        animation: fadeIn 0.8s ease-out forwards;
        animation-delay: 0.3s;
        opacity: 0;
      }
      
      #initial-loader .subtitle {
        font-size: 1.25rem;
        color: #4b5563;
        margin-bottom: 1.5rem;
        animation: fadeIn 0.8s ease-out forwards;
        animation-delay: 0.5s;
        opacity: 0;
      }
      
      #initial-loader .stars {
        display: flex;
        gap: 0.25rem;
        margin-bottom: 2rem;
        animation: fadeIn 0.8s ease-out forwards;
        animation-delay: 0.7s;
        opacity: 0;
      }
      
      #initial-loader .star {
        color: #dc2626;
        font-size: 1.5rem;
      }
      
      #initial-loader .loading-text {
        font-size: 0.875rem;
        font-weight: 500;
        color: #374151;
        text-transform: uppercase;
        letter-spacing: 0.05em;
        animation: pulse 1.5s ease-in-out infinite;
      }
      
      #initial-loader .dots {
        display: flex;
        gap: 0.5rem;
        margin-top: 1.5rem;
      }
      
      #initial-loader .dot {
        width: 0.5rem;
        height: 0.5rem;
        background-color: #dc2626;
        border-radius: 9999px;
        animation: bounce 1.4s ease-in-out infinite;
      }
      
      #initial-loader .dot:nth-child(1) { animation-delay: 0s; }
      #initial-loader .dot:nth-child(2) { animation-delay: 0.15s; }
      #initial-loader .dot:nth-child(3) { animation-delay: 0.3s; }
      
      @keyframes spin {
        from { transform: rotate(0deg); }
        to { transform: rotate(360deg); }
      }
      
      @keyframes pulse {
        0%, 100% { opacity: 1; transform: scale(1); }
        50% { opacity: 0.8; transform: scale(0.95); }
      }
      
      @keyframes fadeIn {
        from { opacity: 0; transform: translateY(10px); }
        to { opacity: 1; transform: translateY(0); }
      }
      
      @keyframes bounce {
        0%, 80%, 100% { transform: translateY(0); }
        40% { transform: translateY(-10px); }
      }
    </style>
  </head>
  <body>
    <!-- Initial Loader - Shown before Vue app loads -->
    <div id="initial-loader">
      <div class="logo-container">
        <div class="spinner-ring">
          <div class="ring-static"></div>
          <div class="ring-animated"></div>
        </div>
        <div class="logo-image">
          <img src="/images/Hotel logo.png" alt="Hotel Logo" />
        </div>
      </div>
      <h1>METROPOLITAN HOTELS</h1>
      <p class="subtitle">Crafting Premier Stays</p>
      <div class="stars">
        <span class="star">★</span>
        <span class="star">★</span>
        <span class="star">★</span>
        <span class="star">★</span>
        <span class="star">★</span>
      </div>
      <p class="loading-text">Loading...</p>
      <div class="dots">
        <span class="dot"></span>
        <span class="dot"></span>
        <span class="dot"></span>
      </div>
    </div>
    
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
