<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Logo Converter</title>
</head>
<body style="background: transparent; margin: 0; padding: 20px;">
  <canvas id="c" width="512" height="512"></canvas>
  <div id="status">Converting...</div>
  <script>
    const svgString = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="512" height="512" fill="none">
  <!-- Outer Prestige Ring: Navy Left Arc & Gold Right Arc -->
  <path d="M 28 86 A 50 50 0 1 1 96 44" stroke="#0B1B35" stroke-width="4.5" stroke-linecap="round"/>
  <path d="M 96 44 A 50 50 0 0 1 34 94" stroke="#E9A11A" stroke-width="4.5" stroke-linecap="round"/>

  <!-- Architectural Hotel Tower Pillars forming 'A' -->
  <path d="M 36 88 L 60 25 L 68 44" stroke="#0B1B35" stroke-width="6.5" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M 68 44 L 84 88" stroke="#0B1B35" stroke-width="6.5" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Inner Hotel Central Tower Column -->
  <rect x="56.5" y="38" width="7" height="42" rx="2" fill="#173A67"/>
  <!-- Structure Crossbar -->
  <path d="M 46 68 L 74 68" stroke="#0B1B35" stroke-width="4" stroke-linecap="round"/>

  <!-- Sweeping Gold 'S' Ribbon Intertwined with 'A' Structure -->
  <path d="M 78 40 C 62 32, 44 42, 50 56 C 55 68, 79 64, 74 78 C 69 88, 48 88, 38 78" 
        stroke="#E9A11A" 
        stroke-width="6" 
        stroke-linecap="round" 
        stroke-linejoin="round"/>

  <!-- Lower Foundation Baseline Curve -->
  <path d="M 32 94 Q 60 102 88 94" stroke="#E9A11A" stroke-width="3" stroke-linecap="round"/>
</svg>`;

    const img = new Image();
    const svgBlob = new Blob([svgString], { type: 'image/svg+xml;charset=utf-8' });
    const url = URL.createObjectURL(svgBlob);
    img.onload = async function() {
      const canvas = document.getElementById('c');
      const ctx = canvas.getContext('2d');
      ctx.clearRect(0, 0, 512, 512);
      ctx.drawImage(img, 0, 0, 512, 512);
      const dataUrl = canvas.toDataURL('image/png');
      
      try {
        await fetch('http://localhost:9876/save', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ base64: dataUrl })
        });
        document.getElementById('status').innerText = 'SAVED_SUCCESSFULLY!';
      } catch (e) {
        document.getElementById('status').innerText = 'ERROR: ' + e;
      }
    };
    img.src = url;
  </script>
</body>
</html>
